name: Generate Low-Res Textures

on:
  push:
    paths:
      - "Original-Photos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-textures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Run texture processing script
        run: python scripts/process_textures.py

      - name: Commit and push generated textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 64p 128p 256p
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate 64p, 128p, and 256p textures"
            git push
          fi
